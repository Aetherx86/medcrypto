name: CI Safety & Quality Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. Security & Safety: Secret Scanning and Repository Hygiene
  # ===========================================================================
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Repository Hygiene & Conflict Marker Verification
        run: |
          echo "Scanning for unresolved git conflict markers..."
          ! git grep -I -nE '^<{7} |^={7}$|^>{7} ' || (echo "Error: Unresolved conflict markers found" && exit 1)
          echo "Repository hygiene check completed successfully."

  # ===========================================================================
  # 2. Rust Quality & Test Matrix
  # ===========================================================================
  rust-workflow:
    name: Rust Quality & Test Matrix (${{ matrix.os }})
    needs: [security-audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Rust Formatting Check (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Rust Linter Check (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust Tests (cargo test)
        run: cargo test --workspace --all-targets --all-features -- --nocapture

      - name: Rust Vulnerability Audit (cargo audit)
        run: cargo audit

      - name: Strict Documentation Build (cargo doc)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
