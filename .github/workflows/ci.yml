name: CI & Release Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test Suite (GDPR, HIPAA, FHE, ZKP, PQC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Execute Full Test Suite
        run: cargo test --all --verbose

  build-release:
    name: Build Release Package 0.0.1-beta
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Verify CLI Binary & Run Demo
        run: ./target/release/medcrypta demo

      - name: Verify Post-Quantum Cryptography Audit
        run: ./target/release/medcrypta quantum-audit

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medcrypta-${{ matrix.os }}-v0.0.1-beta
          path: target/release/medcrypta
