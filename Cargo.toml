[package]
name = "medcrypto"
version = "0.0.1-beta"
edition = "2021"
authors = ["Jeong Hoon Kim"]
description = "Privacy-Preserving Cross-Institutional Healthcare Data Sharing Engine (ZKP + 4th Gen CKKS FHE + Blockchain Audit)"
license = "MIT"
readme = "README.md"

[dependencies]
ed25519-compact = "2.1"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.0"
comfy-table = "7.1"
aes-gcm = "0.10"
eframe = "0.29"

[dev-dependencies]
tempfile = "3.8"
