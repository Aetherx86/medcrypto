[workspace]
members = [".", "component"]

[package]
name = "medcrypto"
version = "0.1.0"
edition = "2021"
authors = ["Jeong Hoon Kim"]
description = "Privacy-Preserving Cross-Institutional Healthcare Data Sharing Engine (ZKP + 4th Gen CKKS FHE + Blockchain Audit)"
license = "MIT"
readme = "README.md"

[dependencies]
ed25519-compact = "2.1"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
rand_distr = "0.6"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.1"
comfy-table = "8.0"
aes-gcm = "0.11"
eframe = "0.37"

[dev-dependencies]
tempfile = "3.8"
