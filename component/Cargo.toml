[package]
name = "medcrypto-component"
description = "MedCrypto's core cryptography and homomorphic encryption as a WebAssembly Component with no imports"
version = "0.2.2"
edition = "2021"
authors = ["Jeong Hoon Kim"]
license = "CC-BY-ND-4.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
ed25519-compact = { version = "2.1", default-features = false }
hkdf = "0.12"
medcrypto-fhe = { path = "../crates/medcrypto-fhe", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = "0.10"
subtle = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.46"

[dev-dependencies]
hex = "0.4"
