[package]
name = "medcrypto-component"
description = "MedCrypto's core cryptography as a WebAssembly Component with no imports"
version = "0.1.0"
edition = "2021"
authors = ["Jeong Hoon Kim"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
ed25519-compact = { version = "2.1", default-features = false }
hkdf = "0.13"
sha2 = "0.11"
subtle = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.57"

[dev-dependencies]
hex = "0.4"
