[package]
name = "medcrypto-fhe"
version = "0.4.0"
edition = "2021"
authors = ["Jeong Hoon Kim"]
license = "CC-BY-NC-ND-4.0"
description = "RNS-CKKS and RNS-BFV homomorphic encryption, with relinearization, rescaling, Galois rotations and k-of-n threshold decryption"
publish = false

[features]
default = ["os-rng"]
# Lets the convenience functions draw from the operating system. Without it, which is how the Wasm
# component builds, every function that needs randomness takes a random number generator from the caller.
os-rng = ["rand_core/getrandom"]

[dependencies]
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
