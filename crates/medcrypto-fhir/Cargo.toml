[package]
name = "medcrypto-fhir"
version = "0.4.0"
edition = "2021"
authors = ["Jeong Hoon Kim"]
license = "CC-BY-NC-ND-4.0"
description = "HL7 FHIR R4 ingestion: bundle parsing, LOINC and UCUM normalization, winsorization and imputation"
publish = false

[features]
default = ["http"]
http = ["dep:ureq", "dep:rustls"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"], optional = true }
ureq = { version = "3", optional = true }
